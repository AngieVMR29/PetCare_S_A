{% extends 'base.html' %}
{% block title %}Solicitar servicio · PetCare{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;margin:auto">
  <h2>Solicitar: {{ service.title }}</h2>
  <p class="muted">{{ service.provider.business_name }} · ${{ service.reference_price|floatformat:0 }} COP</p>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn">Enviar solicitud</button>
  </form>
</div>
{% endblock %}
