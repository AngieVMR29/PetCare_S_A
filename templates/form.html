{% extends 'base.html' %}
{% block title %}{{ title }} · PetCare{% endblock %}
{% block content %}
<div class="card">
  <h2>{{ title }}</h2>

    {{ form.as_p }}

    <a class="btn sec" href="{% url 'catalog:dashboard' %}">Cancelar</a>
  </form>
</div>
{% endblock %}
