{% extends 'base.html' %}
{% block title %}Ingresar · PetCare{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:auto">
  <h2>Ingresar</h2>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn">Ingresar</button>
  </form>
  <p class="muted">¿No tienes cuenta? <a href="{% url 'accounts:register' %}">Regístrate</a></p>
</div>
{% endblock %}
