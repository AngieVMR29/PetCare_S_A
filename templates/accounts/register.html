{% extends 'base.html' %}
{% block title %}Registro · PetCare{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;margin:auto">
  <h2>Crear cuenta</h2>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <p class="muted">Al registrarte aceptas el tratamiento de tus datos personales conforme a la Ley 1581 de 2012.</p>
    <button class="btn">Registrarme</button>
  </form>
  <p class="muted">¿Ya tienes cuenta? <a href="{% url 'accounts:login' %}">Ingresa</a></p>
</div>
{% endblock %}
